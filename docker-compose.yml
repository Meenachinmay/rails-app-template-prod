# Local development stack: Rails app + PostgreSQL
#
# Usage:
#   cp .env.example .env   # first time
#   docker compose up --build
#   open http://localhost:3000
#
# Postgres is exposed on host port 5435 (5432–5434 are often busy on this machine).

name: bookkit

services:
  db:
    image: postgres:16-alpine
    container_name: bookkit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bookkit_development}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookkit} -d ${POSTGRES_DB:-bookkit_development}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bookkit-web
    restart: unless-stopped
    # Build CSS once at boot, then serve. Use `bin/dev` on the host for live Tailwind watch.
    command:
      [
        "bash",
        "-c",
        "bundle exec rails db:prepare && bundle exec rails tailwindcss:build && bundle exec rails server -b 0.0.0.0 -p 3000"
      ]
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bookkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bookkit_development}
      DATABASE_URL: postgres://${POSTGRES_USER:-bookkit}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-bookkit_development}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_cache:
